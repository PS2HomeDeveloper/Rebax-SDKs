name: Build SDK ps2

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Publish a release with this tag (empty = artifacts only)
        default: ""

jobs:
  sdk-ps2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Take the official ps2dev environment
        run: |
          docker pull ps2dev/ps2dev:latest
          docker inspect --format '{{index .RepoDigests 0}}' ps2dev/ps2dev:latest > image-digest.txt
          cat image-digest.txt
          id=$(docker create ps2dev/ps2dev:latest)
          docker cp "$id:/usr/local/ps2dev" ps2dev-env
          docker rm "$id"
          ls ps2dev-env

      - name: Keep only headers and libraries
        run: python3 scripts/sdk.py ps2 --ps2dev ps2dev-env --out sdk-ps2 --source "$(cat image-digest.txt)"

      - name: Pack
        run: python3 scripts/sdk.py pack --root sdk-ps2 --top sdk-ps2 --name sdk-ps2 --dest dist

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-sdk-ps2
          path: dist/*
          compression-level: 0

      - name: Manifest
        if: inputs.release_tag != ''
        run: python3 scripts/sdk.py manifest --dir dist

      - uses: softprops/action-gh-release@v2
        if: inputs.release_tag != ''
        with:
          tag_name: ${{ inputs.release_tag }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
