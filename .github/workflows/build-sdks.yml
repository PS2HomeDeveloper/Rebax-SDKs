name: Build SDK packages

on:
  workflow_dispatch:
    inputs:
      only:
        description: Build only this target id (empty = all)
        default: ""
      release_tag:
        description: Upload to this release tag (empty = the latest release)
        default: ""

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: python3 scripts/common.py matrix --only "${{ inputs.only }}"

  build:
    needs: plan
    runs-on: ${{ matrix.runner || 'ubuntu-24.04' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Take the official ps2dev environment
        if: matrix.script == 'ps2'
        run: |
          docker pull ps2dev/ps2dev:latest
          docker inspect --format '{{index .RepoDigests 0}}' ps2dev/ps2dev:latest > source.txt
          cat source.txt
          id=$(docker create ps2dev/ps2dev:latest)
          docker cp "$id:/usr/local/ps2dev" ps2dev-env
          docker rm "$id"

      - name: Set up emulation
        if: matrix.script == 'linux'
        uses: docker/setup-qemu-action@v3

      - name: Install build tools (macOS)
        if: matrix.script == 'macos' || matrix.script == 'ios'
        run: brew install ninja cmake

      - name: Install Android NDK
        if: matrix.script == 'android'
        env:
          NDK_VERSION: 27.3.13750724
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install build tools
        if: matrix.script == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake curl

      - name: Collect the SDK
        run: |
          if [ "${{ matrix.script }}" = "ps2" ]; then
            python3 scripts/ps2.py --arg "${{ matrix.arg }}" --out sdk-out --source "$(cat source.txt)"
          elif [ "${{ matrix.script }}" = "linux" ]; then
            docker run --rm --platform "${{ matrix.platform }}" -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/w" -w /w alpine:3.20 sh -c 'apk add --no-cache python3 > /dev/null && python3 scripts/linux.py --arg "${{ matrix.arg }}" --out sdk-out'
          else
            python3 scripts/${{ matrix.script }}.py --arg "${{ matrix.arg }}" --out sdk-out
          fi

      - name: Pack
        run: python3 scripts/common.py pack --root sdk-out --top "sdk-${{ matrix.id }}" --name "rebax-sdk-${{ matrix.id }}" --dest dist

      - uses: actions/upload-artifact@v4
        with:
          name: tree-${{ matrix.id }}
          path: dist/*.tree.txt

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.id }}
          path: |
            dist/*.tar.xz
            dist/*.sha256
          compression-level: 0

  trees:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: trees-all
          pattern: tree-*
          delete-merged: true

  release:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: Publish to the latest release
        run: |
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then tag=$(gh release view --json tagName -q .tagName 2>/dev/null || true); fi
          if [ -z "$tag" ]; then tag=v1.0.0; gh release create "$tag" --title "$tag" --notes ""; fi
          gh release download "$tag" --pattern manifest.json --dir dist 2>/dev/null || true
          python3 scripts/common.py manifest --dir dist
          gh release upload "$tag" dist/*.tar.xz dist/manifest.json --clobber
