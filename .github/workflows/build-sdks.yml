name: Build SDK packages

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/build-sdks.yml"
  repository_dispatch:
    types: [rebax-sdk-changed]
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: python3 scripts/common.py matrix 

  build:
    needs: plan
    runs-on: ${{ matrix.runner || 'ubuntu-24.04' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the PS2 environment from source
        if: matrix.script == 'ps2'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl xz-utils patch
          base="https://github.com/PS2HomeDeveloper/Rebax-Toolchains/releases/latest/download"
          export PS2DEV="$PWD/ps2dev-env"
          export PS2SDK="$PS2DEV/ps2sdk"
          export GSKIT="$PS2DEV/gsKit"
          mkdir -p "$PS2DEV" work
          curl -fsSL "$base/rebax-gcc-ps2-linux-x86_64.tar.xz" | tar -xJ -C "$PS2DEV"
          export PATH="$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin"
          mips64r5900el-ps2-elf-gcc --version | head -n 1
          : > source.txt
          git clone --depth 1 https://github.com/ps2dev/ps2toolchain-ee.git work/ps2toolchain-ee
          echo "ps2toolchain-ee $(git -C work/ps2toolchain-ee rev-parse HEAD)" >> source.txt
          mkdir -p work/build
          for step in 003-newlib 004-newlib-nano 005-pthread-embedded 007-post-install; do
            (cd work/build && bash "$GITHUB_WORKSPACE/work/ps2toolchain-ee/scripts/$step.sh")
          done
          for repo in ps2sdk gsKit; do
            git clone --depth 1 "https://github.com/ps2dev/$repo.git" "work/$repo"
            echo "$repo $(git -C work/$repo rev-parse HEAD)" >> source.txt
          done
          (cd work/ps2sdk && unset PS2SDKSRC && make -j"$(nproc)" || make -j1; make -j"$(nproc)" install)
          for lib in libcglue libpthreadglue libprofglue libkernel libcdvd; do
            ln -sf "../../../ps2sdk/ee/lib/$lib.a" "$PS2DEV/ee/mips64r5900el-ps2-elf/lib/$lib.a"
          done
          ln -sf "$PS2DEV/share/ps2dev.cmake" "$PS2SDK/ps2dev.cmake"
          (cd work/gsKit && make -j"$(nproc)" && make -j"$(nproc)" install)
          git clone --depth 1 https://github.com/ps2dev/ps2link.git work/ps2link
          echo "ps2link $(git -C work/ps2link rev-parse HEAD)" >> source.txt
          (cd work/ps2link && make -C iop LOADHIGH=1 PWOFFONRESET=0 && make -C ee LOADHIGH=1 PWOFFONRESET=0)
          mkdir -p link-out
          cp work/ps2link/ee/ps2link.elf link-out/ps2link.elf
          cat source.txt

      - name: Build the PS1 libraries from source
        if: matrix.script == 'ps1'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake git curl xz-utils build-essential
          mkdir -p ps1-tc
          curl -fsSL "https://github.com/PS2HomeDeveloper/Rebax-Toolchains/releases/latest/download/rebax-gcc-ps1-linux-x86_64.tar.xz" | tar -xJ -C ps1-tc
          ps1-tc/bin/mipsel-none-elf-gcc --version | head -n 1
          echo "REBAX_PS1_TOOLCHAIN=$PWD/ps1-tc" >> "$GITHUB_ENV"

      - name: Set up emulation
        if: matrix.script == 'linux'
        uses: docker/setup-qemu-action@v3

      - name: Install build tools (macOS)
        if: matrix.script == 'macos' || matrix.script == 'ios'
        run: brew install ninja cmake

      - name: Install Android NDK
        if: matrix.script == 'android'
        env:
          NDK_VERSION: 27.3.13750724
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install build tools
        if: matrix.script == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake curl

      - name: Collect the SDK
        run: |
          if [ "${{ matrix.script }}" = "ps2" ]; then
            python3 scripts/ps2.py --arg "${{ matrix.arg }}" --out sdk-out --source "$(cat source.txt)" --link link-out/ps2link.elf
          elif [ "${{ matrix.script }}" = "linux" ]; then
            docker run --rm --platform "${{ matrix.platform }}" -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/w" -w /w alpine:3.20 sh -c 'apk add --no-cache python3 > /dev/null && python3 scripts/linux.py --arg "${{ matrix.arg }}" --out sdk-out'
          else
            python3 scripts/${{ matrix.script }}.py --arg "${{ matrix.arg }}" --out sdk-out
          fi

      - name: Build classes.dex for the Android SDK
        if: matrix.script == 'android'
        env:
          PLATFORM_API: "34"
          BUILD_TOOLS: 34.0.0
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-$PLATFORM_API" "build-tools;$BUILD_TOOLS" > /dev/null
          jar_file="$ANDROID_HOME/platforms/android-$PLATFORM_API/android.jar"
          d8="$ANDROID_HOME/build-tools/$BUILD_TOOLS/d8"
          src="sdk-out/graphics/java"
          test -n "$(find "$src" -name '*.java')" || { echo "No SDL Java sources in $src"; exit 1; }
          mkdir -p work/classes sdk-out/graphics/dex
          javac -nowarn -encoding UTF-8 -source 8 -target 8 -classpath "$jar_file" -d work/classes $(find "$src" -name '*.java')
          jar cf work/classes.jar -C work/classes .
          "$d8" --release --min-api 21 --lib "$jar_file" --output work work/classes.jar
          cp work/classes.dex sdk-out/graphics/dex/classes.dex
          ls -l sdk-out/graphics/dex/classes.dex

      - name: Get the Rebax source
        uses: actions/checkout@v4
        with:
          repository: PS2HomeDeveloper/Rebax
          path: rebax-src

      - name: Add the Rebax runtime
        run: |
          sudo chown -R "$(id -u):$(id -g)" sdk-out
          kind=modern
          if [ "${{ matrix.script }}" = "ps1" ]; then kind=ps1; fi
          if [ "${{ matrix.script }}" = "ps2" ]; then kind=ps2; fi
          mkdir -p sdk-out/rebax
          mkdir -p sdk-out/rebax/include
          cp -R rebax-src/sdk/common/include/. sdk-out/rebax/include/
          cp -R "rebax-src/sdk/$kind/api" sdk-out/rebax/api
          cp -R "rebax-src/sdk/$kind/systems" sdk-out/rebax/systems
          cp rebax-src/sdk/LICENSE sdk-out/rebax/LICENSE
          sed -n 's/^ENGINE_VERSION *:= *//p' rebax-src/Makefile | head -n 1 > sdk-out/rebax/VERSION
          git -C rebax-src rev-parse HEAD > sdk-out/rebax/SOURCE.txt
          cat sdk-out/rebax/VERSION sdk-out/rebax/SOURCE.txt
          find sdk-out/rebax -type f | wc -l

      - name: Pack
        run: python3 scripts/common.py pack --root sdk-out --top "${{ matrix.id }}" --name "rebax-sdk-${{ matrix.id }}" --dest dist

      - uses: actions/upload-artifact@v4
        with:
          name: tree-${{ matrix.id }}
          path: dist/*.tree.txt

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.id }}
          path: |
            dist/*.tar.xz
            dist/*.sha256
          compression-level: 0

  trees:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: trees-all
          pattern: tree-*
          delete-merged: true

  release:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: Publish to the latest release
        run: |
          tag=$(curl -fsSL https://raw.githubusercontent.com/PS2HomeDeveloper/Rebax/main/Makefile | sed -n 's/^ENGINE_VERSION *:= *//p' | head -n 1)
          echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Cannot read the engine version"; exit 1; }
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --title "Rebax SDKs ${tag#v}" --notes "SDK packages for Rebax Engine ${tag#v}."
          gh release download "$tag" --pattern manifest.json --dir dist 2>/dev/null || true
          python3 scripts/common.py manifest --dir dist
          gh release upload "$tag" dist/*.tar.xz dist/manifest.json --clobber
