name: Build SDK packages

on:
  workflow_dispatch:
    inputs:
      only:
        description: Build only this target id (empty = all)
        default: ""
      release_tag:
        description: Upload to this release tag (empty = the latest release)
        default: ""

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: python3 scripts/common.py matrix --only "${{ inputs.only }}"

  build:
    needs: plan
    runs-on: ${{ matrix.runner || 'ubuntu-24.04' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Take the official ps2dev environment
        if: matrix.script == 'ps2'
        run: |
          docker pull ps2dev/ps2dev:latest
          docker inspect --format '{{index .RepoDigests 0}}' ps2dev/ps2dev:latest > source.txt
          cat source.txt
          id=$(docker create ps2dev/ps2dev:latest)
          docker cp "$id:/usr/local/ps2dev" ps2dev-env
          docker rm "$id"

      - name: Set up emulation
        if: matrix.script == 'linux'
        uses: docker/setup-qemu-action@v3

      - name: Install build tools (macOS)
        if: matrix.script == 'macos' || matrix.script == 'ios'
        run: brew install ninja cmake

      - name: Install Android NDK
        if: matrix.script == 'android'
        env:
          NDK_VERSION: 27.3.13750724
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install build tools
        if: matrix.script == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake curl

      - name: Collect the SDK
        run: |
          if [ "${{ matrix.script }}" = "ps2" ]; then
            python3 scripts/ps2.py --arg "${{ matrix.arg }}" --out sdk-out --source "$(cat source.txt)"
          elif [ "${{ matrix.script }}" = "linux" ]; then
            docker run --rm --platform "${{ matrix.platform }}" -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/w" -w /w alpine:3.20 sh -c 'apk add --no-cache python3 > /dev/null && python3 scripts/linux.py --arg "${{ matrix.arg }}" --out sdk-out'
          else
            python3 scripts/${{ matrix.script }}.py --arg "${{ matrix.arg }}" --out sdk-out
          fi

      - name: Build classes.dex for the Android SDK
        if: matrix.script == 'android'
        env:
          PLATFORM_API: "34"
          BUILD_TOOLS: 34.0.0
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-$PLATFORM_API" "build-tools;$BUILD_TOOLS" > /dev/null
          jar_file="$ANDROID_HOME/platforms/android-$PLATFORM_API/android.jar"
          d8="$ANDROID_HOME/build-tools/$BUILD_TOOLS/d8"
          src="sdk-out/graphics/java"
          test -n "$(find "$src" -name '*.java')" || { echo "No SDL Java sources in $src"; exit 1; }
          mkdir -p work/classes sdk-out/graphics/dex
          javac -nowarn -encoding UTF-8 -source 8 -target 8 -classpath "$jar_file" -d work/classes $(find "$src" -name '*.java')
          jar cf work/classes.jar -C work/classes .
          "$d8" --release --min-api 21 --lib "$jar_file" --output work work/classes.jar
          cp work/classes.dex sdk-out/graphics/dex/classes.dex
          ls -l sdk-out/graphics/dex/classes.dex

      - name: Validate SDK layout
        run: |
          python3 - <<'PY'
          import os, sys
          root = "sdk-out"
          required = []
          if "${{ matrix.script }}" == "android":
              runtime_dir = {
                  "arm64-v8a": "aarch64-linux-android",
                  "armeabi-v7a": "arm-linux-androideabi",
                  "x86": "i686-linux-android",
                  "x86_64": "x86_64-linux-android"}["${{ matrix.arg }}"]
              required = ["graphics/static/lib/libSDL2.a", "runtime/lib/%s/libc++_static.a" % runtime_dir,
                  "runtime/lib/%s/libc++abi.a" % runtime_dir,
                  "graphics/dex/classes.dex"]
          elif "${{ matrix.script }}" == "windows":
              required = ["graphics/lib/libSDL2.a", "graphics/lib/libSDL2.dll.a", "graphics/bin/SDL2.dll"]
          elif "${{ matrix.script }}" == "linux":
              required = ["graphics/lib/libSDL2.a", "standard/lib/crt1.o"]
          for relative in required:
              path = os.path.join(root, relative)
              if not os.path.isfile(path):
                  raise SystemExit("missing SDK file: " + path)
          print("validated", len(required), "SDK files")
          PY

      - name: Pack
        run: python3 scripts/common.py pack --root sdk-out --top "${{ matrix.id }}" --name "rebax-sdk-${{ matrix.id }}" --dest dist

      - uses: actions/upload-artifact@v4
        with:
          name: tree-${{ matrix.id }}
          path: dist/*.tree.txt

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.id }}
          path: |
            dist/*.tar.xz
            dist/*.sha256
          compression-level: 0

  trees:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: trees-all
          pattern: tree-*
          delete-merged: true

  release:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: Publish to the latest release
        run: |
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then tag=$(gh release view --json tagName -q .tagName 2>/dev/null || true); fi
          if [ -z "$tag" ]; then tag=v1.0.0; gh release create "$tag" --title "$tag" --notes ""; fi
          gh release download "$tag" --pattern manifest.json --dir dist 2>/dev/null || true
          python3 scripts/common.py manifest --dir dist
          gh release upload "$tag" dist/*.tar.xz dist/manifest.json --clobber
